<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁结构监测与限行决策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin:.2rem}</style></head><body><h1>桥梁结构监测与限行决策</h1><p>融合传感、巡检、交通荷载和天气数据，以可恢复批次串联告警、处置记录与审计事件。</p><ul><li>提交带 <code>op_id</code>（操作号）、<code>basis_version</code>（依据版本）、<code>traffic_notice_no</code>（交通通告号）。</li><li>同号重送沿用首次结果；并发推进先到者占用，后到者留下 <code>pending_review</code> 现场记录待复核。</li><li>监测值/天气/通告变化后未完成批次按新依据重算，已完成决定保留当时快照。</li><li>写入失败后按操作号从检查点恢复；旧记录自动补全操作号与依据版本。</li></ul><button onclick="loadItems()">刷新告警列表</button><button onclick="loadRecover()">查看可恢复操作</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>
async function getJson(url,role){const r=await fetch(url,{headers:{'X-Actor':'demo','X-Role':role||'viewer'}});return await r.json()}
async function loadItems(){document.getElementById('out').textContent=JSON.stringify(await getJson('/api/items'),null,2)}
async function loadRecover(){document.getElementById('out').textContent=JSON.stringify(await getJson('/api/operations/recover','bridge_engineer'),null,2)}
</script></body></html>
